  https://github.com/DThrawn/ignitebill/releases/download/v%v/app-foss-%a-release.apk

Builds:
  - versionName: 1.2.2
    versionCode: 171
    commit: 1020c7517aca9b11d54078bad928e5ff743f14dd
    output: build/app/outputs/flutter-apk/app-foss-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - sed -i '/foojay-resolver/d' android/settings.gradle.kts
      - cp /home/vagrant/metadata/build.gradle.kts android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - find .pub-cache -type d -name "example" -prune -exec rm -rf {} +
      - find .pub-cache -type d -name "test" -prune -exec rm -rf {} +
      - find .pub-cache -type d -name "extension" -prune -exec rm -rf {} +
      - find .pub-cache -type f -name "*.wasm" -delete
      - find .pub-cache -type f -name "*.exe" -delete
      - find .pub-cache -type f -name "*.zip" -delete
      - find .pub-cache -type f -name "*.tar.gz" -delete
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor foss --split-per-abi
        --target-platform="android-arm"

