Builds:
  - versionName: 1.2.2
    versionCode: 171
    commit: 1020c7517aca9b11d54078bad928e5ff743f14dd
    output: android/app/build/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - sed -i '/signingConfig.*release/d' android/app/build.gradle.kts
      - sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' android/app/build.gradle.kts
      - sed -i 's/jvmTarget = "17"/jvmTarget = "21"/g' android/app/build.gradle.kts
      - sed -i '/foojay-resolver/d' android/settings.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor foss --split-per-abi
        --target-platform="android-arm"

