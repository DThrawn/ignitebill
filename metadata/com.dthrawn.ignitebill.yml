  - Time
License: MIT
AuthorName: DThrawn
WebSite: https://github.com/DThrawn/ignitebill
SourceCode: https://github.com/DThrawn/ignitebill
IssueTracker: https://github.com/DThrawn/ignitebill/issues
AutoName: IgniteBill

Summary: Finance Manager & Time Tracker
Description: |-
  IgniteBill is a minimalist, open-source application designed to help you track your finances and manage your time effectively.

  Features:
  - Track daily expenses.
  - Manage time logs for projects.
  - Simple and intuitive interface.
  - Open-source and privacy-focused.

RepoType: git
Repo: https://github.com/DThrawn/ignitebill.git

Builds:
  - versionName: 1.2.3
    versionCode: 181
    commit: f19725b2e2c3f37677d3fb345e84f592bdb7c0b4
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -E 's/jvmToolchain\s*\(\s*[0-9]+\s*\)/jvmToolchain(21)/g' android/app/build.gradle.kts
      - sed -i -E 's/JvmTarget.JVM_[0-9]+/JvmTarget.JVM_21/g' android/app/build.gradle.kts
      - sed -i -E 's/JavaVersion.VERSION_[0-9]+/JavaVersion.VERSION_21/g' android/app/build.gradle.kts
      - sed -i '/signingConfig.*release/d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor foss --split-per-abi --target-platform="android-arm"
    output: build/app/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
    binary: https://github.com/DThrawn/ignitebill/releases/download/v%v/app-foss-armeabi-v7a-release.apk

