Binaries: 
  https://github.com/DThrawn/ignitebill/releases/download/v%v/app-foss-%a-release.apk

Builds:
  - versionName: 1.2.3
    versionCode: 181
    commit: f19725b2e2c3f37677d3fb345e84f592bdb7c0b4
    output: android/app/build/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -E 's/jvmToolchain\s*\(\s*[0-9]+\s*\)/jvmToolchain(21)/g' android/app/build.gradle*
      - sed -i -E 's/JvmTarget.JVM_[0-9]+/JvmTarget.JVM_21/g' android/app/build.gradle*
      - sed -i -E 's/JavaVersion.VERSION_[0-9]+/JavaVersion.VERSION_21/g' android/app/build.gradle*
      - sed -i '/signingConfig.*release/d' android/app/build.gradle*
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor foss --split-per-abi
        --target-platform="android-arm"

